name: audit-history-evidence

# Temporary read-only research capture. Removed from the final review patch.
# Public Git objects only: no repository writes, approvals, releases or secrets.
on:
  pull_request:
    paths:
      - tools/audit_history_export.py
      - .github/workflows/audit-history-evidence.yml
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned canonical state and public historical heads
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/mininet-labs/Mininet.git \
            '+refs/heads/main:refs/remotes/audit/main' \
            '+refs/pull/*/head:refs/remotes/audit-prs/*'
          git cat-file -e 684baa103c075299a375d1ed9a3327185c0ba02b^{commit}
      - name: Capture every PR through the declared cutoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/audit_history_export.py --repo mininet-labs/Mininet \
            --through 326 --expected-count 174 \
            --canonical-sha 684baa103c075299a375d1ed9a3327185c0ba02b \
            --out /tmp/mininet-history-evidence
      - name: Export Git objects without local configuration
        run: |
          set -euo pipefail
          git bundle create /tmp/mininet-history-evidence/history.bundle --all
          git bundle verify /tmp/mininet-history-evidence/history.bundle
          git show-ref > /tmp/mininet-history-evidence/refs.txt
          sha256sum /tmp/mininet-history-evidence/history.bundle \
            > /tmp/mininet-history-evidence/history-bundle.sha256
      - name: Preserve research input, not audit approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mininet-pr-history-through-326-revalidated
          path: /tmp/mininet-history-evidence/
          if-no-files-found: error
          retention-days: 14
