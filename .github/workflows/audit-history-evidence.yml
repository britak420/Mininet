name: audit-history-evidence

# Temporary read-only authoring check, not approval or release authorization.
# No push, repository mutation, pull_request_target, or secret credential.
on:
  pull_request:
    paths:
      - docs/audits/pr-history-2026-09-08/patches/**
      - .github/workflows/audit-history-evidence.yml
permissions:
  contents: read
jobs:
  patch-validation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the review patch to its exact canonical base
        run: |
          set -euo pipefail
          mkdir -p /tmp/mininet-patch-evidence
          cp docs/audits/pr-history-2026-09-08/patches/0001-frost-and-sequence-hardening.patch /tmp/mininet-patch-evidence/submitted.patch
          git worktree add --detach /tmp/mininet-patch-base 684baa103c075299a375d1ed9a3327185c0ba02b
          cd /tmp/mininet-patch-base
          git apply --check /tmp/mininet-patch-evidence/submitted.patch
          git apply /tmp/mininet-patch-evidence/submitted.patch
          git diff --check
      - name: Toolchain and canonical formatting
        working-directory: /tmp/mininet-patch-base
        run: |
          set -euo pipefail
          rustup show 2>&1 | tee /tmp/mininet-patch-evidence/toolchain.log
          rustup target add wasm32-wasip2
          cargo fmt --all
          git diff --check
          git diff --binary > /tmp/mininet-patch-evidence/formatted.patch
          sha256sum /tmp/mininet-patch-evidence/submitted.patch /tmp/mininet-patch-evidence/formatted.patch > /tmp/mininet-patch-evidence/patch-digests.txt
      - name: Treasury tests including one-use compile-fail test
        working-directory: /tmp/mininet-patch-base
        run: |
          set -euo pipefail
          cargo test -p mini-treasury --all-features --locked 2>&1 | tee /tmp/mininet-patch-evidence/treasury-tests.log
      - name: CLI sequence regression tests
        working-directory: /tmp/mininet-patch-base
        run: |
          set -euo pipefail
          cargo test -p mini-cli --lib sequence --all-features --locked 2>&1 | tee /tmp/mininet-patch-evidence/sequence-tests.log
      - name: Strict Clippy of both touched packages and their examples
        working-directory: /tmp/mininet-patch-base
        run: |
          set -euo pipefail
          cargo clippy -p mini-treasury -p mini-cli --all-targets --all-features --locked -- -D warnings 2>&1 | tee /tmp/mininet-patch-evidence/clippy.log
      - name: Preserve exact evidence, including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mininet-narrow-patch-validation
          path: /tmp/mininet-patch-evidence/
          if-no-files-found: error
          retention-days: 14
