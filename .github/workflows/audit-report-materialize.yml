# Temporary publication helper; removed in the final documentation commit.
# No checkout, repository-code execution, commit, ref update, approval or release.
name: Audit report materialization
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/audit-report-materialize.yml'
permissions: {}
jobs:
  capture:
    if: github.event.pull_request.number == 327 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/full-pr-founder-vision-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Derive fixed evidence map from original captured archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, urllib.error, urllib.parse, urllib.request, zipfile
          API = 'https://api.github.com/repos/mininet-labs/Mininet'
          HEADERS = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(urllib.request.Request(API+'/actions/artifacts/10045573430/zip',headers=HEADERS),timeout=45)
              raise ValueError('expected archive redirect')
          except urllib.error.HTTPError as exc:
              if exc.code not in (301,302,303,307,308):
                  raise
              location = exc.headers['Location']
          target = urllib.parse.urlparse(location)
          if target.scheme != 'https' or not target.hostname or not target.hostname.endswith(('.blob.core.windows.net','.actions.githubusercontent.com')):
              raise ValueError('unexpected archive host')
          # Do not forward the GitHub credential to storage.
          with urllib.request.urlopen(urllib.request.Request(location),timeout=60) as response:
              archive = response.read(25100910)
          expected = '4dbb5b4f8f6e7911e5f048be3bbb34b8771503d6702a288854e534e6343774cd'
          if len(archive) != 25100909 or hashlib.sha256(archive).hexdigest() != expected:
              raise ValueError('not the pinned evidence archive')
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              inv = json.loads(z.read('inventory.json'))
              rows = []
              for source in inv['pull_requests']:
                  raw = z.read(source['evidence_file'])
                  record = json.loads(raw)
                  row = dict(source)
                  row['capture_record_sha256'] = hashlib.sha256(raw).hexdigest()
                  row['dossier'] = 'ALL_174_PR_REVIEWS.md#pr-%04d' % row['number']
                  row['files'] = [{key: f[key] for key in ['filename','previous_filename','sha','status','additions','deletions','changes','blob_url','raw_url'] if key in f} | {'api_patch_present':'patch' in f} for f in record['files']]
                  if len(row['files']) != row['changed_files']:
                      raise ValueError('changed-file count mismatch')
                  rows.append(row)
              result = {key:value for key,value in inv.items() if key != 'pull_requests'}
              result['publication_note'] = 'Generated from the pinned capture. review_completed remains the exporter\'s false collection marker; per-PR research is in the dossier. This map proves inventory traceability, not audit completion.'
              result['capture_artifact'] = {'run_id':34200283626,'artifact_id':10045573430,'archive_sha256':expected,'url':'https://github.com/mininet-labs/Mininet/actions/runs/34200283626/artifacts/10045573430','expires_at':'2026-09-22T07:39:32Z'}
              result['pull_requests'] = rows
              if len(rows) != 174 or len({r['number'] for r in rows}) != 174:
                  raise ValueError('inventory mismatch')
              data = (json.dumps(result,ensure_ascii=False,indent=2)+'\n').encode()
          digest = hashlib.sha256(data).hexdigest()
          sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if len(data) != 1764369 or digest != '755bc45c079ffa0408f5d70cef1838ad0e66559b249a0b66282df41431817a32' or sha != '2df39a0eed604ac7597d424f2549140fcac69b8b':
              raise ValueError('locally reproduced evidence map mismatch')
          request = urllib.request.Request(API+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers=HEADERS|{'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=60) as response:
              created = json.load(response)
          if created['sha'] != sha:
              raise ValueError('created blob mismatch')
          out = pathlib.Path('/tmp/evidence-map');out.mkdir()
          (out/'EVIDENCE_MAP.json').write_bytes(data)
          info = {'path':'EVIDENCE_MAP.json','bytes':len(data),'sha256':digest,'git_blob_sha':sha,'pull_requests':len(rows),'file_change_records':sum(r['changed_files'] for r in rows)}
          (out/'verification.json').write_text(json.dumps(info,indent=2)+'\n')
          print(json.dumps(info))
          print('PASS: exact captured evidence map; no commit or ref written.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-review-evidence-map
          path: /tmp/evidence-map/
          if-no-files-found: error
          retention-days: 14
