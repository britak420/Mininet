# Temporary publication helper. Removed in the final documentation commit.
# No checkout, report-code execution, commits, ref updates, approvals or releases.
# The only write operation creates two content-addressed Git blobs after SHA-256 checks.
name: Audit report materialization
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/audit-report-materialize.yml'
permissions: {}
jobs:
  capture:
    if: github.event.pull_request.number == 327 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/full-pr-founder-vision-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Install exact renderer without repository code or token
        run: python3 -m pip install --user --disable-pip-version-check --no-deps markdown-it-py==4.2.0 mdurl==0.1.2
      - name: Verify original bytes and create only unreferenced document blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, json, lzma, os, pathlib, re, urllib.request
          from markdown_it import MarkdownIt
          API = 'https://api.github.com/repos/mininet-labs/Mininet'
          def request(path, payload=None):
              if payload is None:
                  if not re.fullmatch(r'/git/blobs/[0-9a-f]{40}', path):
                      raise ValueError('unexpected read path')
              elif path != '/git/blobs':
                  raise ValueError('only unreferenced blob creation is permitted')
              req = urllib.request.Request(API + path, data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read(8 * 1024 * 1024 + 1)
              if len(raw) > 8 * 1024 * 1024:
                  raise ValueError('response too large')
              return json.loads(raw)
          def gitsha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def blob(sha):
              record = request('/git/blobs/' + sha)
              data = base64.b64decode(record['content'])
              if gitsha(data) != sha:
                  raise ValueError('Git blob mismatch')
              return data
          def check(data, size, digest):
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise ValueError('original document integrity mismatch')
              return data
          chunks = '''276cbd534d3fefed5f7dcecd6ac30d66a04f8693
          5af86bd9fa493c577b6abfc7838162c806ab618b
          0ea17b23d3a0a01a03c4aabf0a505730e207f237
          2b9a418c1318cc0860384d04bc45d134c0c5045b
          552b4cb6d7dedac9a42ad57553700e4b87670a36
          4fc11a2a6fe89788417f186163d8fdcca0afddde
          b1abfc509ae52869a5f97dd954b84ba6c2bd7f78
          16d4a22f7acc5f8ca88a719af4c28e3df5e2c821
          a29237e86ad7b02916bd5c652da46d47041cb6e2
          5907652f5df0e6eca8579ea8843978cfac780917
          13be7a646f3311eb189b6aba07136031c9d94ed4'''.split()
          compressed = bytearray(b''.join(blob(sha) for sha in chunks))
          if len(compressed) != 132000 or compressed[122915:122920] != bytes.fromhex('8f8794eceb'):
              raise ValueError('unexpected transfer state')
          # Repair the five transport-corrupted bytes, verified against the original local file.
          # The complete compressed stream and resulting text must still match their independent hashes.
          compressed[122915:122920] = bytes.fromhex('80efa32734')
          compressed.extend(base64.b64decode(''))
          check(compressed, 132992, '779624f222241a5b43cf4e417da3e7e71322a92ac8a7cac6ed27f3cd8c020a39')
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          dossiers = decoder.decompress(compressed, max_length=735098)
          if not decoder.eof or decoder.unused_data:
              raise ValueError('incomplete or trailing compressed stream')
          check(dossiers, 735097, '1391caedd1056256e5af7446a76d072eaee6d9d8c0683c653c4721827ffea769')
          master = check(blob('fef2864d80361686434a9c83ae5f4724892f25be'), 23774, '2dfba8da1d789c1abdd3b21de24abd1050ba1bc20ec317c597907aee6c8e8e95')
          findings = check(blob('5b92fd7c3a9899de72845a0ddfcf0d43ae276000'), 52216, '87d380b907c64f4be45ac6158d33927c10ddec31238c6fa4463f44d6f241f3fb')
          template_bytes = blob('61ecfb39d6ea912c44990f0eed99e77bfc17c6f3') + blob('d04d726205555f4af6af8bdcd07186503561719e')
          if gitsha(template_bytes) != 'a20c8626c160512c8f5d5b7e47fb09ba503a60fb':
              raise ValueError('template mismatch')
          decoder = bz2.BZ2Decompressor()
          template_raw = decoder.decompress(template_bytes, max_length=45054)
          if not decoder.eof or decoder.unused_data or len(template_raw) != 45053:
              raise ValueError('template framing mismatch')
          template = json.loads(template_raw)
          renderer = MarkdownIt('commonmark', {'html': False}).enable('table')
          pieces = re.split(r'<a id="pr-(\d{4})"></a>\n\n', dossiers.decode())
          rows = []
          for j in range(1, len(pieces), 2):
              number = pieces[j]
              text = re.sub(r'\n\n---\n\n$', '', pieces[j+1])
              text = re.sub(r'^## PR #', '# PR #', text)
              title = re.match(r'# PR #(\d+): (.+)\n', text)
              if not title or int(title[1]) != int(number):
                  raise ValueError('dossier heading mismatch')
              rows.append((number, title[1], title[2], renderer.render(text)))
          if len(rows) != 174 or len({row[0] for row in rows}) != 174:
              raise ValueError('coverage mismatch')
          navigation = ''.join(f'<a class="prlink" href="#pr-{n}">#{num} {title}</a>' for n,num,title,_ in rows)
          html = template['prefix'] + navigation + template['nav_end']
          html += '<section id="executive">' + renderer.render(master.decode()) + '</section>'
          html += '<section id="findings">' + renderer.render(findings.decode()) + '</section>'
          html += template['extra_sections']
          html += ''.join(f'<article id="pr-{n}" class="dossier">' + text + '</article>' for n,_,_,text in rows)
          html += template['suffix']
          html = check(html.encode(), 956401, 'f406d97485ad9fce44fe638a1a781a3ca5c264346bd3354499621a703ebdba0e')
          out = pathlib.Path('/tmp/published-review-bytes'); out.mkdir()
          records = []
          # No branch write occurs here. The connector attaches these verified blobs in a later commit.
          for name, data in [('ALL_174_PR_REVIEWS.md', dossiers), ('EXHAUSTIVE_REVIEW.html', html)]:
              expected = gitsha(data)
              created = request('/git/blobs', {'encoding':'base64', 'content':base64.b64encode(data).decode()})
              if created['sha'] != expected or blob(expected) != data:
                  raise ValueError('created document did not round-trip')
              record = {'path':name, 'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest(), 'git_blob_sha':expected}
              records.append(record); print(json.dumps(record))
              (out/name).write_bytes(data)
          (out/'verification.json').write_text(json.dumps({'dossiers':len(rows),'exact_original_bytes':True,'files':records},indent=2)+'\n')
          print('PASS: both complete documents match their originals byte for byte; no ref or commit written.')
          PY
      - name: Preserve verified originals and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-full-review-publication
          path: /tmp/published-review-bytes/
          if-no-files-found: error
          retention-days: 14
