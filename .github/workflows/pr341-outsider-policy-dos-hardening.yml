name: PR341 ignore non-authority policy noise

on:
  push:
    branches:
      - gpt/issue-339-decentralized-beta-grants

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gpt/issue-339-decentralized-beta-grants
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Close outsider policy-noise DoS
        env:
          OLD_RESOLVER_B64: 
          NEW_RESOLVER_B64: 
          OUTSIDER_TEST_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('crates/mini-beta-grants/src/lib.rs')
          s = p.read_text()
          old = base64.b64decode(os.environ['OLD_RESOLVER_B64']).decode()
          new = base64.b64decode(os.environ['NEW_RESOLVER_B64']).decode()
          if s.count(old) != 1:
              raise SystemExit(f'unique-policy resolver anchor count {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          t = Path('crates/mini-beta-grants/tests/acceptance.rs')
          body = t.read_text().rstrip()
          test = base64.b64decode(os.environ['OUTSIDER_TEST_B64']).decode()
          if 'outsider_policy_shaped_objects_cannot_veto_the_campaign_policy' not in body:
              t.write_text(body + '\n' + test)
          PY
      - name: Strict focused proof
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p mini-beta-grants --all-targets --all-features -- -D warnings
          cargo test -p mini-beta-grants --all-features
      - name: Remove one-shot workflow and commit hardening
        run: |
          rm .github/workflows/pr341-outsider-policy-dos-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mini-beta-grants .github/workflows/pr341-outsider-policy-dos-hardening.yml
          git diff --cached --check
          git commit -m 'Prevent outsider policy objects from gaining veto power'
          git push origin HEAD:gpt/issue-339-decentralized-beta-grants
