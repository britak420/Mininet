name: PR341 ignore non-authority policy noise

on:
  push:
    branches:
      - gpt/issue-339-decentralized-beta-grants

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gpt/issue-339-decentralized-beta-grants
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Close outsider policy-noise DoS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/mini-beta-grants/src/lib.rs')
          s = p.read_text()
          old = '''pub fn resolve_unique_campaign_policy<B: Backend>(
    store: &Store<B>,
    campaign_id: &ObjectId,
) -> Result<BetaGrantPolicy> {
    let ids = store.by_type(&ObjectType::Custom(BETA_GRANT_POLICY_TYPE.to_string()))?;
    let mut found: Option<BetaGrantPolicy> = None;
    for id in ids {
        let candidate = parse_grant_policy_object(&store.get(&id)?)?;
        if &candidate.campaign_id != campaign_id {
            continue;
        }
        let candidate = validate_policy(store, &id)?;
        if found.is_some() {
            return Err(GrantAcceptanceError::PolicyConflict);
        }
        found = Some(candidate);
    }
    found.ok_or(GrantAcceptanceError::InvalidPolicy)
}
'''
          new = '''pub fn resolve_unique_campaign_policy<B: Backend>(
    store: &Store<B>,
    campaign_id: &ObjectId,
) -> Result<BetaGrantPolicy> {
    let campaign = read_campaign(store, campaign_id)?;
    let ids = store.by_type(&ObjectType::Custom(BETA_GRANT_POLICY_TYPE.to_string()))?;
    let mut found: Option<BetaGrantPolicy> = None;
    for id in ids {
        let object = store.get(&id)?;
        let candidate = match parse_grant_policy_object(&object) {
            Ok(candidate) => candidate,
            // Any DID can publish an object with this custom type. Malformed
            // third-party policy-shaped noise must not gain veto power merely
            // by sharing the type index.
            Err(_) => continue,
        };
        if &candidate.campaign_id != campaign_id
            || candidate.record_author != campaign.record_author
        {
            continue;
        }
        let candidate = match validate_policy(store, &id) {
            Ok(candidate) => candidate,
            // Only fully valid policies by the campaign record authority are
            // candidates for the uniqueness rule. Invalid objects do not become
            // a second policy and therefore cannot manufacture PolicyConflict.
            Err(GrantAcceptanceError::InvalidPolicy)
            | Err(GrantAcceptanceError::PolicyAuthorMismatch)
            | Err(GrantAcceptanceError::InvalidObject) => continue,
            Err(error) => return Err(error),
        };
        if found.is_some() {
            return Err(GrantAcceptanceError::PolicyConflict);
        }
        found = Some(candidate);
    }
    found.ok_or(GrantAcceptanceError::InvalidPolicy)
}
'''
          if s.count(old) != 1:
              raise SystemExit('unique-policy resolver anchor did not match exactly')
          p.write_text(s.replace(old, new, 1))

          t = Path('crates/mini-beta-grants/tests/acceptance.rs')
          body = t.read_text().rstrip()
          test = r'''

#[test]
fn outsider_policy_shaped_objects_cannot_veto_the_campaign_policy() {
    let mut f = Fixture::new();
    let grant = f.testing_grant(BetaAccountId::new([16; 32]).unwrap(), "test", 10);
    let a = f.approve(0, grant.id(), 20);
    let b = f.approve(1, grant.id(), 21);

    // A fully decodable policy payload copied by an unrelated DID must not
    // become a competing policy: policy authority is bound to the campaign
    // record author, not to the custom type string.
    let outsider_copy = ObjectBuilder::new(ObjectType::Custom(
        mini_beta_grants::BETA_GRANT_POLICY_TYPE.to_string(),
    ))
    .timestamp_ms(f.policy.timestamp_ms + 1)
    .sequence(999)
    .payload(f.policy.payload.clone())
    .link("campaign", f.campaign.id().clone())
    .sign(&f.outsider.did(), &f.outsider)
    .unwrap();
    f.store.insert(&outsider_copy).unwrap();

    // Malformed outsider noise with the same type/link is also ignored.
    let malformed = ObjectBuilder::new(ObjectType::Custom(
        mini_beta_grants::BETA_GRANT_POLICY_TYPE.to_string(),
    ))
    .timestamp_ms(152)
    .sequence(1_000)
    .payload(Payload::Public(vec![0xff]))
    .link("campaign", f.campaign.id().clone())
    .sign(&f.outsider.did(), &f.outsider)
    .unwrap();
    f.store.insert(&malformed).unwrap();

    let accepted = validate_grant_acceptance(
        &f.store,
        f.policy.id(),
        grant.id(),
        &[a.id().clone(), b.id().clone()],
    )
    .unwrap();
    assert_eq!(accepted.distinct_approvers, 2);
}
'''
          if 'outsider_policy_shaped_objects_cannot_veto_the_campaign_policy' not in body:
              t.write_text(body + test + '\n')
          PY
      - name: Strict focused proof
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p mini-beta-grants --all-targets --all-features -- -D warnings
          cargo test -p mini-beta-grants --all-features
      - name: Remove one-shot workflow and commit hardening
        run: |
          rm .github/workflows/pr341-outsider-policy-dos-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mini-beta-grants .github/workflows/pr341-outsider-policy-dos-hardening.yml
          git diff --cached --check
          git commit -m 'Prevent outsider policy objects from gaining veto power'
          git push origin HEAD:gpt/issue-339-decentralized-beta-grants
