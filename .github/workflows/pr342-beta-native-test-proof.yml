name: PR342 Beta native flow proof

on:
  push:
    branches:
      - gpt/issue-336-forge-beta-native

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gpt/issue-336-forge-beta-native
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Keep fixture evidence outside the operator sequence lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/mini-cli/tests/beta_native_flow.rs')
          s = p.read_text()
          old = '''    let identity = mini_cli::identity::load(&home).unwrap();
    let mut store = mini_cli::store::open_store(&store_path).unwrap();
    let source = ObjectBuilder::new(ObjectType::Custom("mininet.beta/test-source/v1".to_string()))
        .timestamp_ms(1)
        .sequence(1)
        .payload(Payload::Public(b"accepted-work".to_vec()))
        .sign(&identity.human_did(), &identity.device)
        .unwrap();
'''
          new = '''    let source_author = did_mini::Controller::incept_single().unwrap();
    let mut store = mini_cli::store::open_store(&store_path).unwrap();
    let source = ObjectBuilder::new(ObjectType::Custom("mininet.beta/test-source/v1".to_string()))
        .timestamp_ms(1)
        .sequence(1)
        .payload(Payload::Public(b"accepted-work".to_vec()))
        .sign(&source_author.did(), &source_author)
        .unwrap();
'''
          if s.count(old) != 1:
              raise SystemExit('claim test fixture anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format and prove Beta native flow
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p mini-cli --test beta_native_flow -- -D warnings
          cargo test -p mini-cli --test beta_native_flow
      - name: Remove one-shot workflow and commit proof formatting
        run: |
          rm .github/workflows/pr342-beta-native-test-proof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mini-cli .github/workflows/pr342-beta-native-test-proof.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Prove anonymous Beta native sync flow'
          git push origin HEAD:gpt/issue-336-forge-beta-native
