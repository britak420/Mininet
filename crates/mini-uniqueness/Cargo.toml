[package]
name = "mini-uniqueness"
version = "0.0.1"
description = "Mininet's three-signal personhood/uniqueness fusion (whitepaper SS5): social-vouching graph, physical-presence, and a behavioral-entropy seam pending human-authored ZK design."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
did-mini = { path = "../did-mini" }
mini-presence = { path = "../mini-presence" }

[dev-dependencies]
# Test-only: derives deterministic test nonce bytes via a real hash instead
# of a literal array, matching mini-presence's own test convention and
# mini-keystone's demo_nonce (see tests/vouch.rs). Already resolved
# transitively through mini-presence; this just makes it directly usable
# from integration tests.
mini-crypto = { path = "../mini-crypto" }
