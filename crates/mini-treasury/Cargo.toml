[package]
name = "mini-treasury"
version = "0.0.1"
description = "Community-governed BTC/XMR-to-MINI contribution bookkeeping (whitepaper SS8.2/SS10) plus a founder-overridden (D-0037), AI-authored FROST threshold-signature custody prototype pending external cryptography audit; cross-chain receipt verification remains explicitly out of scope here."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
did-mini = { path = "../did-mini" }
# Same audited primitive-layer crate ed25519-dalek/x25519-dalek already
# build on (D-0014's precedent) -- the raw Ristretto group only. The FROST
# threshold-signature protocol built on top is Mininet-owned (D-0037).
# "zeroize" is on by default upstream, but named explicitly here so this
# crate's own zeroization guarantee (SigningNonces, issue #93) doesn't
# depend on that staying true by accident.
curve25519-dalek = { version = "4", features = ["zeroize"] }
blake3 = "1"
mini-crypto = { path = "../mini-crypto" }
zeroize = "1" # zeroizes FROST round-1 nonces on drop (issue #93)
mini-durable = { path = "../mini-durable" }

[features]
# `frost_dkg`/`frost_reshare`'s hand-rolled Pedersen/Feldman DKG API
# (`dkg_round1`, `dkg_generate_round2_shares`, `dkg_resolve`,
# `dkg_finalize`, `reshare_round1`, `reshare_finalize`,
# `AcknowledgedUnauditedDkg`, ...) is off the crate's default public API
# (D-0507, Gate #93 remediation): a real external audit found this crate
# was extending a second, bespoke DKG implementation finding by finding
# rather than composing an already-audited one. `mini-custody` is the
# production DKG ceremony now -- see its own crate docs. This feature
# keeps the old implementation reachable for its own test/historical
# coverage and any deliberate opt-in comparison work; it is not a
# recommendation to use it for a new production ceremony.
legacy-hand-rolled-dkg = []
# `frost_sign`'s hand-rolled two-round FROST signing math (binding factors,
# Lagrange interpolation, and the Schnorr challenge re-derived from raw
# `curve25519-dalek` scalar/point arithmetic) is off the crate's default
# public API for the same reason `legacy-hand-rolled-dkg` is (Gate #72
# remediation, mirroring D-0507/D-0508): `mini-custody::signing` is the
# production signing path now, wrapping `frost_ristretto255::round1`/
# `round2`/`aggregate` directly instead of re-deriving that protocol a
# second time. This feature keeps the old implementation reachable for its
# own test/historical coverage and any deliberate opt-in comparison work;
# it is not a recommendation to use it for new production signing.
legacy-hand-rolled-signing = []

[[example]]
name = "frost_live_demo"
# Demonstrates `frost_sign`'s hand-rolled signing math specifically, so it
# needs the same feature gate that API is now behind.
required-features = ["legacy-hand-rolled-signing"]
